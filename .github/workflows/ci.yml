name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Bash 3.2 syntax
        run: /bin/bash -n codex-cli install.sh codex-session-paths.sh
      - name: Run isolated integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/build-release.py
      - name: Render Homebrew formula
        run: python3 scripts/render-formula.py "dist/codex-switcher-$(cat VERSION).tar.gz" --output dist/codex-switcher.rb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package
          path: dist/*

